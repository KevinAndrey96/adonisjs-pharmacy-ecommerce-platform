version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pharmastore-app
    restart: unless-stopped
    ports:
      - "3333:3333"
    environment:
      - HOST=0.0.0.0
      - PORT=3333
      - NODE_ENV=development
      - APP_NAME=PharmaStore
      - APP_URL=http://localhost:3333
      - APP_KEY=REDACTED_APP_KEY
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=pharmastore_user
      - DB_PASSWORD=pharmastore_pass
      - DB_DATABASE=pharmastore_db
      - SESSION_DRIVER=cookie
      - HASH_DRIVER=bcrypt
      - MAIL_CONNECTION=smtp
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - MAIL_FROM=no-reply@pharmastore.local
      - PAYMENT_GATEWAY_URL=https://ecouat.credibanco.com/payment/rest/register.do
      - PAYMENT_GATEWAY_USER=sandbox_user
      - PAYMENT_GATEWAY_PASSWORD=sandbox_pass
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes:
      - .:/app
      - /app/node_modules

  mysql:
    image: mysql:8.0
    container_name: pharmastore-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: pharmastore_db
      MYSQL_USER: pharmastore_user
      MYSQL_PASSWORD: pharmastore_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: pharmastore-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP Server
      - "8025:8025"  # Web Dashboard

volumes:
  mysql_data:
