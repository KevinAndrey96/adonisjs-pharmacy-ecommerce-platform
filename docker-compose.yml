services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pharmacy_ecommerce_app
    restart: unless-stopped
    ports:
      - "3333:3333"
    environment:
      HOST: 0.0.0.0
      PORT: 3333
      NODE_ENV: production
      APP_URL: http://localhost:3333
      APP_KEY: ${APP_KEY:?APP_KEY is required, generate one with openssl rand -hex 16}
      ENV_SILENT: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: pharmacy_user
      DB_PASSWORD: pharmacy_pass
      DB_DATABASE: pharmacy_store_db
      MAIL_CONNECTION: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM: no-reply@example.com
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - pharmacy_network

  mysql:
    image: mysql:8.0
    container_name: pharmacy_ecommerce_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_secret_pass
      MYSQL_DATABASE: pharmacy_store_db
      MYSQL_USER: pharmacy_user
      MYSQL_PASSWORD: pharmacy_pass
    volumes:
      - pharmacy_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret_pass"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pharmacy_network

  mailpit:
    image: axllent/mailpit:latest
    container_name: pharmacy_ecommerce_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # SMTP Port
    networks:
      - pharmacy_network

volumes:
  pharmacy_mysql_data:
    driver: local

networks:
  pharmacy_network:
    driver: bridge
